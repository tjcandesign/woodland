<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: #F7F2E8; font-family: 'Inter', sans-serif; padding: 20px; }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; }
  .sw { border-radius: 6px; overflow: hidden; border: 1px solid #DED3C0; background: #FFF; }
  .sw .chip { height: 88px; }
  .sw .meta { padding: 10px 12px; }
  .sw .name { font-size: 12px; font-weight: 600; color: #3C342B; letter-spacing: 0.3px; }
  .sw .hex { font-size: 11px; color: #7D7568; font-family: 'Inter', monospace; margin-top: 2px; letter-spacing: 0.4px; }
</style>
</head>
<body>
<div class="grid">
  <div class="sw"><div class="chip" style="background:#5C4033"></div><div class="meta"><div class="name">Brown</div><div class="hex">#5C4033</div></div></div>
  <div class="sw"><div class="chip" style="background:#3A2820"></div><div class="meta"><div class="name">Brown Dark</div><div class="hex">#3A2820</div></div></div>
  <div class="sw"><div class="chip" style="background:#1B365D"></div><div class="meta"><div class="name">Navy</div><div class="hex">#1B365D</div></div></div>
  <div class="sw"><div class="chip" style="background:#0F2240"></div><div class="meta"><div class="name">Navy Dark</div><div class="hex">#0F2240</div></div></div>
  <div class="sw"><div class="chip" style="background:#07162E"></div><div class="meta"><div class="name">Navy Deep</div><div class="hex">#07162E</div></div></div>
</div>
</body>
</html>
