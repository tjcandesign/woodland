<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: #F7F2E8; font-family: 'Inter', sans-serif; padding: 20px; }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; }
  .sw { border-radius: 6px; overflow: hidden; border: 1px solid #DED3C0; background: #FFF; }
  .sw .chip { height: 88px; }
  .sw .meta { padding: 10px 12px; }
  .sw .name { font-size: 12px; font-weight: 600; color: #3C342B; letter-spacing: 0.3px; }
  .sw .hex { font-size: 11px; color: #7D7568; margin-top: 2px; letter-spacing: 0.4px; }
  .sw .use { font-size: 10px; color: #9E9788; margin-top: 2px; }
</style>
</head>
<body>
<div class="grid">
  <div class="sw"><div class="chip" style="background:#B8860B"></div><div class="meta"><div class="name">Gold</div><div class="hex">#B8860B</div><div class="use">Primary CTA</div></div></div>
  <div class="sw"><div class="chip" style="background:#8A6508"></div><div class="meta"><div class="name">Gold Dark</div><div class="hex">#8A6508</div><div class="use">Hover</div></div></div>
  <div class="sw"><div class="chip" style="background:#D4A93D"></div><div class="meta"><div class="name">Gold Soft</div><div class="hex">#D4A93D</div><div class="use">Eyebrows on dark</div></div></div>
  <div class="sw"><div class="chip" style="background:#5F6C4E"></div><div class="meta"><div class="name">Sage Dark</div><div class="hex">#5F6C4E</div><div class="use">Italic display</div></div></div>
  <div class="sw"><div class="chip" style="background:#7D8A6A"></div><div class="meta"><div class="name">Sage</div><div class="hex">#7D8A6A</div></div></div>
</div>
</body>
</html>
