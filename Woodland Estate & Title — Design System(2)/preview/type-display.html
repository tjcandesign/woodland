<!DOCTYPE html>
<html>
<head>

<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: #F7F2E8; font-family: 'Inter', sans-serif; padding: 32px; color: #3C342B; }

</head>

  <div class="label">Display — italic serif, sage</div>
