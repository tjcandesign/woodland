<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: #F7F2E8; font-family: 'Inter', sans-serif; padding: 24px; }
  .step { display: grid; grid-template-columns: 70px 1fr; gap: 28px; padding: 28px 0; border-top: 1px solid #DED3C0; max-width: 640px; }
  .step:last-child { border-bottom: 1px solid #DED3C0; }
  .num { font-family: 'EB Garamond', serif; font-size: 48px; line-height: 1; color: #B8860B; font-weight: 400; letter-spacing: -1px; }
  .subhead { font-size: 11px; font-weight: 600; letter-spacing: 2.5px; text-transform: uppercase; color: #7D7568; margin-bottom: 8px; }
  h3 { font-family: 'EB Garamond', serif; font-style: italic; font-size: 28px; color: #5F6C4E; margin: 0 0 6px; font-weight: 400; letter-spacing: -0.6px; }
  p { margin: 0; font-size: 15px; color: #5A5146; line-height: 1.65; }
</style>
</head>
<body>
  <div class="step">
    <div class="num">01</div>
    <div>
      <h3>Title Search</h3>
      <div class="subhead">Ensuring Your Property Rights</div>
      <p>We order and rigorously review the title history, and resolve any defects prior to closing.</p>
    </div>
  </div>
  <div class="step">
    <div class="num">02</div>
    <div>
      <h3>Title Insurance</h3>
      <div class="subhead">Guaranteeing Future Property Claims</div>
      <p>Protects both you and your lender against any obstacles to clear and confident ownership.</p>
    </div>
  </div>
</body>
</html>
