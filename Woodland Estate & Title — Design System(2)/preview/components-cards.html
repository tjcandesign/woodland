<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: #FDFAF4; font-family: 'Inter', sans-serif; padding: 28px; }
  .card { background: #FFF; border-radius: 16px; padding: 28px 26px; box-shadow: 0 1px 2px rgba(15,34,64,0.04), 0 24px 48px rgba(15,34,64,0.06); max-width: 320px; }
  .meta { font-size: 11px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: #7D7568; margin-bottom: 12px; }
  .card h3 { font-family: 'EB Garamond', serif; font-weight: 500; font-size: 26px; line-height: 1.2; color: #3C342B; margin: 0 0 10px; letter-spacing: -0.3px; }
  .card p { font-family: 'Inter'; font-size: 15px; line-height: 1.6; color: #7D7568; margin: 0; }
  .wrap { display: flex; gap: 18px; }
  .hairline { background: transparent; border-top: 1px solid #C2B8A1; padding: 28px 0 4px; max-width: 300px; }
  .hairline h4 { font-family: 'EB Garamond', serif; font-style: italic; font-size: 24px; color: #5F6C4E; margin: 0 0 14px; font-weight: 400; letter-spacing: -0.5px; }
  .hairline p { font-family: 'Inter'; font-size: 14px; color: #5A5146; line-height: 1.7; margin: 0; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="meta">First Step</div>
      <h3>Title Search</h3>
      <p>We review the title history and resolve any defects so ownership is clear before you sign.</p>
    </div>
    <div class="hairline">
      <h4>Hairline card.</h4>
      <p>No background, a top rule, and generous padding. Used on editorial feature grids.</p>
    </div>
  </div>
</body>
</html>
