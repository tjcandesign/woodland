<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: #EFE8DB; font-family: 'Inter', sans-serif; padding: 20px; }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; }
  .sw { border-radius: 6px; overflow: hidden; border: 1px solid #C2B8A1; background: #FFF; }
  .sw .chip { height: 88px; }
  .sw .meta { padding: 10px 12px; }
  .sw .name { font-size: 12px; font-weight: 600; color: #3C342B; letter-spacing: 0.3px; }
  .sw .hex { font-size: 11px; color: #7D7568; margin-top: 2px; }
</style>
</head>
<body>
<div class="grid">
  <div class="sw"><div class="chip" style="background:#F2EADD"></div><div class="meta"><div class="name">BG Cream</div><div class="hex">#F2EADD</div></div></div>
  <div class="sw"><div class="chip" style="background:#F7F2E8"></div><div class="meta"><div class="name">BG Paper</div><div class="hex">#F7F2E8</div></div></div>
  <div class="sw"><div class="chip" style="background:#FDFAF4"></div><div class="meta"><div class="name">BG White</div><div class="hex">#FDFAF4</div></div></div>
  <div class="sw"><div class="chip" style="background:#ECE3D3"></div><div class="meta"><div class="name">BG Warm</div><div class="hex">#ECE3D3</div></div></div>
  <div class="sw"><div class="chip" style="background:#FFFFFF;border:1px solid #DED3C0"></div><div class="meta"><div class="name">Pure White</div><div class="hex">#FFFFFF</div></div></div>
</div>
</body>
</html>
