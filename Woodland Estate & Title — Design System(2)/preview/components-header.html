<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: #0F2240; font-family: 'Inter', sans-serif; padding: 20px 24px; }
  .bar { display: flex; align-items: center; justify-content: space-between; }
  .brand img { height: 44px; }
  nav { display: flex; align-items: center; gap: 36px; }
  nav a { font-size: 12px; font-weight: 500; letter-spacing: 2px; text-transform: uppercase; color: rgba(255,255,255,0.7); text-decoration: none; position: relative; padding: 4px 0; }
  nav a.active { color: #FFF; }
  nav a.active::after { content: ''; position: absolute; left: 0; right: 0; bottom: -6px; height: 1.5px; background: #B8860B; }
  nav .cta { background: #B8860B; color: #FFF; padding: 10px 18px; border-radius: 2px; letter-spacing: 1.8px; font-weight: 600; }
</style>
</head>
<body>
  <div class="bar">
    <a class="brand"><img src="../assets/woodland-stacked-white.svg" alt=""></a>
    <nav>
      <a>Services</a>
      <a class="active">Closing Process</a>
      <a>Code of Conduct</a>
      <a>Contact</a>
      <a class="cta">Send Earnest Money</a>
    </nav>
  </div>
</body>
</html>
