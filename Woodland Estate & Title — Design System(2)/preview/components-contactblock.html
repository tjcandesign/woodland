<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: #FDFAF4; font-family: 'Inter', sans-serif; padding: 28px; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; max-width: 640px; }
  .block { background: #FDFAF4; border: 1px solid #DED3C0; border-radius: 4px; padding: 22px 24px; }
  .block .label { font-size: 10.5px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: #9E9788; margin-bottom: 8px; }
  .block .value { font-family: 'EB Garamond', serif; font-size: 20px; color: #5C4033; margin: 0; line-height: 1.5; }
  .block a { color: #5C4033; text-decoration: none; border-bottom: 1px solid #B8860B; padding-bottom: 1px; }
</style>
</head>
<body>
  <div class="grid">
    <div class="block"><div class="label">Address</div><p class="value">659 C Street, SE<br>Washington, DC 20003</p></div>
    <div class="block"><div class="label">Phone</div><p class="value"><a>(202) 516-6855</a></p></div>
    <div class="block"><div class="label">Fax</div><p class="value">(202) 888-1179</p></div>
    <div class="block"><div class="label">Email</div><p class="value"><a>woodlandteam@…</a></p></div>
  </div>
</body>
</html>
