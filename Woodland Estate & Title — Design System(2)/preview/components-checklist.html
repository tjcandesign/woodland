<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: #FDFAF4; font-family: 'Inter', sans-serif; padding: 28px; }
  ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 14px; max-width: 540px; }
  li { position: relative; padding: 0 0 0 32px; font-size: 16px; color: #3C342B; line-height: 1.55; }
  li::before {
    content: ''; position: absolute; left: 0; top: 7px; width: 14px; height: 10px;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 14 10' fill='none'><path d='M1 5.2L4.8 9 13 1' stroke='%23B8860B' stroke-width='1.75' stroke-linecap='round' stroke-linejoin='round'/></svg>");
    background-repeat: no-repeat; background-size: contain;
  }
</style>
</head>
<body>
  <ul>
    <li>Assurance of a clear title</li>
    <li>Title protection</li>
    <li>Secure access to documents</li>
    <li>Clarity about the process</li>
    <li>Quotes on costs</li>
  </ul>
</body>
</html>
