<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: #F7F2E8; font-family: 'Inter', sans-serif; padding: 28px; }
  .row { display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap; }
  .swatch { width: 300px; border-radius: 16px; overflow: hidden; background: #FFF; border: 1px solid #DED3C0; }
  .swatch .box { height: 120px; background: #FFF; display: flex; align-items: center; justify-content: center; }
  .box-card { box-shadow: 0 1px 2px rgba(15,34,64,0.04), 0 24px 48px rgba(15,34,64,0.06); border-radius: 16px; background: #FFF; padding: 32px 40px; margin: 18px; }
  .swatch.flat .box { box-shadow: none; }
  .meta { padding: 12px 14px; font-size: 12px; color: #7D7568; border-top: 1px dotted #DED3C0; }
  .meta b { color: #3C342B; letter-spacing: 0.2px; }
  .btn-shadow { display: inline-flex; padding: 14px 24px; background: #B8860B; color: #FFF; border-radius: 2px; font-size: 11px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; box-shadow: 0 1px 0 rgba(255,255,255,0.1) inset, 0 4px 14px rgba(184,134,11,0.35); }
</style>
</head>
<body>
  <div class="row">
    <div class="swatch">
      <div class="box"><div class="box-card">Card</div></div>
      <div class="meta"><b>Elevation · Card</b><br>0 1px 2px rgba(15,34,64,.04),<br>0 24px 48px rgba(15,34,64,.06)</div>
    </div>
    <div class="swatch">
      <div class="box" style="background:#F7F2E8"><span class="btn-shadow">Send Earnest Money</span></div>
      <div class="meta"><b>Elevation · Gold CTA glow</b><br>0 4px 14px rgba(184,134,11,.35)</div>
    </div>
  </div>
</body>
</html>
