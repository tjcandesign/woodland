<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  body { margin: 0; background: #F7F2E8; font-family: 'Inter', sans-serif; padding: 18px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .tile { position: relative; height: 200px; border-radius: 6px; overflow: hidden; }
  .tile img { width: 100%; height: 100%; object-fit: cover; display: block; filter: saturate(0.85); }
  .overlay { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(15,34,64,0.35) 0%, rgba(15,20,40,0.88) 100%); }
  .lbl { position: absolute; left: 14px; bottom: 12px; color: #FCFAF6; font-size: 11px; font-weight: 600; letter-spacing: 2.5px; text-transform: uppercase; z-index: 2; }
  .cap { font-size: 10px; color: #9E9788; letter-spacing: 2px; text-transform: uppercase; margin-top: 8px; }
</style>
</head>
<body>
  <div class="grid">
    <div>
      <div class="tile">
        <img src="../assets/eastern-market.jpeg">
        <div class="overlay"></div>
        <div class="lbl">Eastern Market · Hero</div>
      </div>
      <div class="cap">B&W archival — home hero</div>
    </div>
    <div>
      <div class="tile">
        <img src="../assets/map from current website.jpg">
        <div class="overlay"></div>
        <div class="lbl">Capitol Hill · Map</div>
      </div>
      <div class="cap">Engraved plan — mid-page + CTA band</div>
    </div>
  </div>
</body>
</html>
