<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: #F7F2E8; font-family: 'Inter', sans-serif; padding: 32px; color: #3C342B; }
  .row { margin-bottom: 22px; }
  .eye { font-family: 'Inter'; font-size: 11px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: #7D7568; }
  .eye-gold { color: #D4A93D; }
  .eye-muted { color: rgba(60,52,43,0.5); }
  .demo { margin-top: 8px; font-family: 'EB Garamond', serif; font-style: italic; font-weight: 400; color: #5F6C4E; font-size: 32px; line-height: 1.1; letter-spacing: -0.8px; }
  .darksec { background: #0F2240; padding: 22px; border-radius: 4px; margin-top: 18px; }
  .darksec .eye-gold { color: #D4A93D; }
  .darksec .demo { color: #FCFAF6; font-style: normal; letter-spacing: -0.4px; }
</style>
</head>
<body>
  <div class="row">
    <div class="eye">Eyebrow · 11 / 600 / 3px tracking</div>
    <div class="demo">On paper surfaces — muted warm grey.</div>
  </div>
  <div class="row darksec">
    <div class="eye eye-gold">Eyebrow on dark</div>
    <div class="demo">Gold-soft · #D4A93D</div>
  </div>
</body>
</html>
