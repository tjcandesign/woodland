<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: #F7F2E8; font-family: 'Inter', sans-serif; padding: 24px; }
  .row { display: flex; align-items: flex-end; gap: 8px; margin-bottom: 14px; }
  .bar { background: #5F6C4E; height: 20px; border-radius: 2px; display: flex; align-items: center; justify-content: center; color: #FFF; font-size: 11px; font-family: 'Inter', monospace; }
  .lbl { font-size: 11px; color: #7D7568; width: 100px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; }
  .val { font-size: 11px; color: #9E9788; margin-left: 10px; }
</style>
</head>
<body>
  <div class="row"><div class="lbl">Step</div><div class="bar" style="width:8px"></div><div class="val">8px</div></div>
  <div class="row"><div class="lbl">Dense</div><div class="bar" style="width:14px"></div><div class="val">14px — nav gap mobile</div></div>
  <div class="row"><div class="lbl">Button</div><div class="bar" style="width:24px"></div><div class="val">24px — btn padding-x</div></div>
  <div class="row"><div class="lbl">Card</div><div class="bar" style="width:32px"></div><div class="val">32px — card padding</div></div>
  <div class="row"><div class="lbl">Grid</div><div class="bar" style="width:40px"></div><div class="val">40px — split gap (mobile)</div></div>
  <div class="row"><div class="lbl">Row</div><div class="bar" style="width:56px"></div><div class="val">56px — gutter max</div></div>
  <div class="row"><div class="lbl">Section</div><div class="bar" style="width:110px"></div><div class="val">110px — section padding-y</div></div>
  <div class="row"><div class="lbl">Feature</div><div class="bar" style="width:180px"></div><div class="val">180px — feature/image section</div></div>
</body>
</html>
