<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: #F7F2E8; font-family: 'Inter', sans-serif; padding: 24px; display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
  .tile { border-radius: 50%; padding: 12px; display: flex; align-items: center; justify-content: center; width: 110px; height: 110px; box-sizing: border-box; }
  .tile.n { background: #0F2240; }
  .tile.c { background: #F2EADD; }
  .tile img { width: 100%; height: 100%; display: block; }
  .cell { text-align: center; }
  .cap { font-size: 10px; color: #9E9788; letter-spacing: 2px; text-transform: uppercase; margin-top: 8px; }
</style>
</head>
<body>
  <div class="cell"><div class="tile n"><img src="../assets/circle-white.svg"></div><div class="cap">Circle — on navy</div></div>
  <div class="cell"><div class="tile c"><img src="../assets/circle-dark.svg"></div><div class="cap">Circle — on cream</div></div>
  <div class="cell"><div class="tile n"><img src="../assets/circle-w-white.svg" style="width:55%;height:55%;margin:auto"></div><div class="cap">Monogram W</div></div>
  <div class="cell"><div class="tile n"><img src="../assets/circle-ring-white.svg"></div><div class="cap">Ring (spins on scroll)</div></div>
</body>
</html>
