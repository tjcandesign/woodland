<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: #F7F2E8; font-family: 'Inter', sans-serif; padding: 24px; display: flex; gap: 18px; flex-wrap: wrap; align-items: center; }
  .tile { background: #0F2240; border-radius: 4px; padding: 24px 28px; display: flex; align-items: center; justify-content: center; }
  .tile.cream { background: #F2EADD; }
  .tile.white { background: #FDFAF4; border: 1px solid #DED3C0; }
  .tile img { height: 46px; display: block; }
  .tile.w img { height: 52px; }
  .cap { font-size: 10px; color: #9E9788; letter-spacing: 2px; text-transform: uppercase; margin-top: 6px; text-align: center; }
  .cell { text-align: center; }
</style>
</head>
<body>
  <div class="cell"><div class="tile"><img src="../assets/woodland-stacked-white.svg"></div><div class="cap">Stacked — white</div></div>
  <div class="cell"><div class="tile cream"><img src="../assets/woodland-stacked-dark.svg"></div><div class="cap">Stacked — dark</div></div>
  <div class="cell"><div class="tile white"><img src="../assets/woodland-logo-full.svg" style="height:38px"></div><div class="cap">Full wordmark</div></div>
</body>
</html>
