<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: #F7F2E8; font-family: 'Inter', sans-serif; padding: 28px; color: #3C342B; }
  .stack > div { margin-bottom: 18px; }
  .l { font-family: 'Inter'; font-size: 10px; font-weight: 600; letter-spacing: 2.5px; text-transform: uppercase; color: #9E9788; margin-bottom: 4px; }
  .h2 { font-family: 'EB Garamond', serif; font-style: italic; font-weight: 400; color: #5F6C4E; font-size: 46px; line-height: 1.08; letter-spacing: -1.2px; }
  .h3 { font-family: 'EB Garamond', serif; font-style: italic; font-weight: 400; color: #5F6C4E; font-size: 30px; line-height: 1.15; letter-spacing: -0.8px; }
  .h4 { font-family: 'EB Garamond', serif; font-weight: 500; color: #5C4033; font-size: 22px; line-height: 1.25; }
</style>
</head>
<body>
  <div class="stack">
    <div><div class="l">H2 · 46 / italic / sage-dark</div><div class="h2">From search to settlement.</div></div>
    <div><div class="l">H3 · 30 / italic / sage-dark</div><div class="h3">Ensuring your property rights.</div></div>
    <div><div class="l">H4 · 22 / 500 / brown</div><div class="h4">What We Provide</div></div>
  </div>
</body>
</html>
