<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: #FDFAF4; font-family: 'Inter', sans-serif; padding: 32px; }
  .grid { display: grid; grid-template-columns: 1fr auto 1fr auto 1fr; align-items: stretch; gap: 0; }
  .card { display: flex; flex-direction: column; gap: 10px; background: #FFF; border-radius: 16px; padding: 22px 20px; box-shadow: 0 1px 2px rgba(15,34,64,0.04), 0 24px 48px rgba(15,34,64,0.06); }
  .label { font-size: 10px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: #7D7568; }
  .card h3 { font-family: 'EB Garamond', serif; font-weight: 500; font-size: 20px; color: #3C342B; margin: 0; letter-spacing: -0.3px; }
  .card p { font-size: 13px; line-height: 1.55; color: #7D7568; margin: 0; }
  .arrow { align-self: center; padding: 0 10px; color: #C2B8A1; }
  .arrow.active { color: #B8860B; }
  svg { width: 40px; height: 16px; display: block; }
</style>
</head>
<body>
  <div class="grid">
    <div class="card"><div class="label">First Step</div><h3>Title Search</h3><p>Review the title history and resolve defects.</p></div>
    <div class="arrow active"><svg viewBox="0 0 56 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M2 10 H50" /><path d="M42 3 L50 10 L42 17" /></svg></div>
    <div class="card"><div class="label">Second Step</div><h3>Title Insurance</h3><p>Underwritten coverage for you and your lender.</p></div>
    <div class="arrow"><svg viewBox="0 0 56 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M2 10 H50" /><path d="M42 3 L50 10 L42 17" /></svg></div>
    <div class="card"><div class="label">Third Step</div><h3>Escrow</h3><p>Funds held in trust until every condition is met.</p></div>
  </div>
</body>
</html>
